<!DOCTYPE html>
<html class="show--consent">
    <head>
        <style>
        body {
            background-color: black;
            color: aliceblue;
            font-family: Arial,sans-serif;
            padding: 20px;
        }

        #taskList {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e1e;
            margin: 8px 0;
            padding: 10px;
            border-radius: 6px;
        }

        button {
            background-color: #1e1e1e;
            color: #909490;
            border: none;
            padding: 10px 16px;
            cursor: pointer;
            border-radius: 4px;
        }

        input{
            padding: 10px;
            margin-right: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: white;
        }
    </style>
    </head>
    <body>
        <p id="factDisplay"></p>
        <img id="Image">

        <button id="addBtn">New Fact</button>
        <button id="addBtn1">New Image</button>
        <script>
              
            const button = document.getElementById('addBtn');
            const factDisplay = document.getElementById('factDisplay');
            const button1 = document.getElementById('addBtn1');
            const image = document.getElementById('Image');
                       
            async function getFact() {
                const response = await fetch('https://catfact.ninja/fact');
                const data = await response.json();
                console.log(response);
                console.log(data);
                factDisplay.textContent = data.fact ;
            }

            function getImage() {
                image.src = 'https://picsum.photos/200/300?random=' + Date.now();
            }
            
            button.addEventListener('click', (event) => {
                event.preventDefault();
                getFact(); 
                
                setTimeout(() => {
                    button.textContent = 'New Fact';
                }, 5000);

                button.textContent = 'Loading...';

            });
            button1.addEventListener('click', (event) => {
                event.preventDefault();
                getImage();
            });
                     
        </script>
    </body>
</html>
